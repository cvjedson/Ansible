---
- hosts: all
  become: true
  tasks:

  - name: update repostiotry index
    ansible.builtin.apt:
      update-cache: yes

  - name: install apache2 package
    ansible.builtin.apt:
      name: apache2
      state: latest

  - name: install  support php
    ansible.builtin.apt:
      name: libapache2-mod-php
      state: latest
